$kind: http-request
description: Validates that the server correctly rejects malformed or incomplete payloads with HTTP 400 Bad Request.
url: "{{baseUrl}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "",
      "department": "InvalidDepartment",
      "salary": -500
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Errors array returned with validation messages", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(false);
          pm.expect(jsonData.errors).to.be.an('array');
          pm.expect(jsonData.errors.length).to.be.above(0);
      });
    language: text/javascript
order: 9000
